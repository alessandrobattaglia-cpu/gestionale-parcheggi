<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: transparent; }
    .map-container { background: white; padding: 10px; border-radius: 12px; border: 1px solid #e0e0e0; }
    
    /* Stili base per i posti auto */
    rect.spot { 
      cursor: pointer; 
      stroke: #1a252f; 
      stroke-width: 1.5; 
      transition: all 0.2s ease; 
      rx: 3px; 
      ry: 3px; 
      opacity: 0.9; 
    }
    rect.spot:hover { 
      stroke-width: 3; 
      stroke: #000; 
      filter: brightness(1.2); 
      opacity: 1; 
    }
    
    /* Colori default per le diverse Zone (quando il posto è LIBERO) */
    .zone-bassa    { fill: #f1c40f; } /* Giallo */
    .zone-alta     { fill: #e67e22; } /* Arancione */
    .zone-alloggi  { fill: #2ecc71; } /* Verde */
    .zone-studenti { fill: #3498db; } /* Azzurro */
    .zone-piazzale { fill: #9b59b6; } /* Viola */
    
    /* Colori degli stati (quando il posto è OCCUPATO o BLOCCATO) */
    .occupied { fill: #e74c3c !important; opacity: 0.95; }  /* Rosso - Occupato da utente */
    .blocked  { fill: #7f8c8d !important; opacity: 0.95; }  /* Grigio - Bloccato da Admin */

    /* Stile del Tooltip (Fumetto info al passaggio del mouse) */
    #tooltip {
      position: absolute; 
      display: none; 
      background: rgba(0, 0, 0, 0.88); 
      color: #fff;
      padding: 10px 14px; 
      border-radius: 8px; 
      font-size: 13px; 
      pointer-events: none; 
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
      white-space: pre-wrap;
      line-height: 1.4;
    }
  </style>
</head>

    </svg>
  </div>

  <script>
    const prenotazioniDB = ST_PRENOTAZIONI_JSON_PLACEHOLDER;
    const tooltip = document.getElementById("tooltip");

    document.querySelectorAll('.spot').forEach(spot => {
      const postoId = spot.getAttribute('data-id');
      const info = prenotazioniDB[postoId];

      if (info) {
        if (info.username.toLowerCase() === 'admin') {
          spot.classList.add('blocked');
        } else {
          spot.classList.add('occupied');
        }
      }

      spot.addEventListener('mousemove', (e) => {
        let text = `🚘 Stallo: ${postoId}\n`;
        if (info) {
          if (info.username.toLowerCase() === 'admin') {
            text += `⛔ STATO: NON DISPONIBILE`;
          } else {
            text += `👤 Assegnato a: ${info.username}\n🏢 Gruppo: ${info.gruppo}\n👥 A bordo: ${info.numero_persone}`;
          }
        } else {
          text += `✅ STATO: LIBERO`;
        }
        
        tooltip.innerText = text;
        tooltip.style.display = 'block';
        tooltip.style.left = e.pageX + 15 + 'px';
        tooltip.style.top = e.pageY + 15 + 'px';
      });

      spot.addEventListener('mouseout', () => {
        tooltip.style.display = 'none';
      });
    });
  </script>

</html>
