<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: transparent; }
    .map-container { background: white; padding: 10px; border-radius: 12px; border: 1px solid #e0e0e0; }
    
    /* Stili base per i posti auto */
    rect.spot { cursor: pointer; stroke: #2c3e50; stroke-width: 1.5; transition: all 0.3s; rx: 3px; ry: 3px; opacity: 0.85; }
    rect.spot:hover { stroke-width: 3; filter: brightness(1.2); opacity: 1; }
    
    /* Colori delle zone (Liberi) */
    .zone-bassa { fill: #f1c40f; }      /* Giallo */
    .zone-alta { fill: #e67e22; }       /* Arancione */
    .zone-alloggi { fill: #2ecc71; }    /* Verde */
    
    /* Colori degli stati (Occupati) */
    .occupied { fill: #e74c3c !important; opacity: 0.9; }    /* Rosso - Occupato */
    .blocked { fill: #7f8c8d !important; opacity: 0.9; }     /* Grigio - Bloccato Admin */

    /* Stile del Tooltip (Fumetto info) */
    #tooltip {
      position: absolute; display: none; background: rgba(0, 0, 0, 0.85); color: #fff;
      padding: 10px 15px; border-radius: 6px; font-size: 13px; pointer-events: none; z-index: 1000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); white-space: pre-wrap;
    }
  </style>
</head>
<body>
  
  <div id="tooltip"></div>

  <div class="map-container">
    <!-- viewBox: gestisce le proporzioni. Modifica 1100 e 950 a seconda delle dimensioni reali del tuo screenshot se necessario -->
    <svg viewBox="0 0 1100 950" width="100%" height="750">
      
      <!-- 1. LA TUA IMMAGINE DI SFONDO -->
      <image href="ST_BACKGROUND_IMAGE_PLACEHOLDER" x="0" y="0" width="1100" height="950" preserveAspectRatio="none" />

      <!-- 2. STALLI ZONA BASSA (Da riposizionare) -->
      <g id="zona-bassa">
        <!-- Esempio: cambia le coordinate x e y per farli combaciare con le strade della tua immagine -->
        <rect class="spot zone-bassa" x="400" y="500" width="40" height="20" data-id="Bassa-1" />
        <rect class="spot zone-bassa" x="450" y="500" width="40" height="20" data-id="Bassa-2" />
        <!-- Aggiungi gli altri posti copiando la riga qui sopra e cambiando data-id, x e y -->
      </g>

      <!-- 3. STALLI ZONA ALTA (Da riposizionare) -->
      <g id="zona-alta">
        <rect class="spot zone-alta" x="800" y="300" width="40" height="20" data-id="Alta-1" />
        <rect class="spot zone-alta" x="850" y="300" width="40" height="20" data-id="Alta-2" />
      </g>

      <!-- 4. STALLI ALLOGGI (Da riposizionare) -->
      <g id="zona-alloggi">
        <rect class="spot zone-alloggi" x="600" y="700" width="30" height="25" data-id="Alloggi-1" />
        <rect class="spot zone-alloggi" x="640" y="700" width="30" height="25" data-id="Alloggi-2" />
      </g>
    </svg>
  </div>

  <script>
    const prenotazioniDB = ST_PRENOTAZIONI_JSON_PLACEHOLDER;
    const tooltip = document.getElementById("tooltip");

    document.querySelectorAll('.spot').forEach(spot => {
      const postoId = spot.getAttribute('data-id');
      const info = prenotazioniDB[postoId];

      if (info) {
        if (info.username.toLowerCase() === 'admin') {
          spot.classList.add('blocked');
        } else {
          spot.classList.add('occupied');
        }
      }

      spot.addEventListener('mousemove', (e) => {
        let text = `🚘 Stallo: ${postoId}\n`;
        if (info) {
          if (info.username.toLowerCase() === 'admin') {
            text += `⛔ STATO: NON DISPONIBILE`;
          } else {
            text += `👤 Assegnato a: ${info.username}\n🏢 Gruppo: ${info.gruppo}\n👥 A bordo: ${info.numero_persone}`;
          }
        } else {
          text += `✅ STATO: LIBERO`;
        }
        
        tooltip.innerText = text;
        tooltip.style.display = 'block';
        tooltip.style.left = e.pageX + 15 + 'px';
        tooltip.style.top = e.pageY + 15 + 'px';
      });

      spot.addEventListener('mouseout', () => {
        tooltip.style.display = 'none';
      });
    });
  </script>
</body>
</html>
